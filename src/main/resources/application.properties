spring.application.name=money_management_system

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/money_management_system
spring.datasource.username=postgres
spring.datasource.password=Ruhul@2002

# Server Configuration
server.servlet.context-path=/api/v1.0


#JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format.sql = true

# Email Configuration

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=${BREVO_FROM_EMAIL}







